name: Public media integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/verify_current_media.py
      - name: Reject forbidden changed filenames
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE" HEAD > changed.txt
          python -c "import pathlib,re; assert not re.search('school|grade10|защит|письменная|10класс',pathlib.Path('changed.txt').read_text(),re.I)"
